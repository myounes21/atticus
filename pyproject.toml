[project]
name = "atticus"
version = "0.1.0"
description = "Legal Intelligence Platform — private, self-hosted RAG for law firms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.34.0",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "pydantic-settings>=2.13.1",
    "ollama>=0.5.1",
    "tiktoken>=0.12.0",
    "qdrant-client>=1.17.1",
    "elasticsearch>=8.15.0,<9.0.0",
    "redis>=5.0.0",
    "PyJWT>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.2,<4.0.0",
    "websockets>=14.0",
    "celery>=5.4.0",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2.9",
    "langfuse>=2.60.7",
    "sentence-transformers>=3.0.1",
    "langchain-google-vertexai>=3.2.4",
]

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "locust>=2.44.4",
    "pandas>=3.0.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.0",
    "ragas>=0.4.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
