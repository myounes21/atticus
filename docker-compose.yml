# Atticus — Docker Compose full-stack development environment
# Start with: docker compose up

services:
  # ── Infrastructure ──────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atticus}
      POSTGRES_USER: ${POSTGRES_USER:-atticus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atticus_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
      - ./backend/migrations/002_roles_and_hardening.sql:/docker-entrypoint-initdb.d/002_roles_and_hardening.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atticus}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Application ─────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atticus}:${POSTGRES_PASSWORD:-atticus_dev}@postgres:5432/${POSTGRES_DB:-atticus}
    volumes:
      - upload_tmp:/tmp/atticus_uploads
      - ./demo data:/app/demo data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    user: "0:0"
    mem_limit: 1g
    command: sh -c "/app/.venv/bin/python -m backend.scripts.apply_migrations && /app/.venv/bin/uvicorn backend.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atticus}:${POSTGRES_PASSWORD:-atticus_dev}@postgres:5432/${POSTGRES_DB:-atticus}
    volumes:
      - upload_tmp:/tmp/atticus_uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    user: "0:0"
    mem_limit: 1g
    command: sh -c "/app/.venv/bin/python -m backend.scripts.apply_migrations && /app/.venv/bin/celery -A backend.tasks.celery_app:celery_app worker --loglevel=info -Q ingestion"
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import redis;redis.Redis(host='redis',port=6379).ping()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        API_PROXY_BASE_URL: ${API_PROXY_BASE_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_PROXY_BASE_URL=http://backend:8000
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || wget -q --spider http://$$HOSTNAME:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  demo-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["demo"]
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atticus}:${POSTGRES_PASSWORD:-atticus_dev}@postgres:5432/${POSTGRES_DB:-atticus}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./demo data:/app/demo data:ro
    user: "0:0"
    command: sh -c "uv run python -m backend.scripts.reset_and_seed_demo_data"
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-atticus_dev}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "while true; do
      pg_dump -h postgres -U ${POSTGRES_USER:-atticus} -d ${POSTGRES_DB:-atticus} > /backups/atticus_$$(date +%Y%m%d_%H%M%S).sql;
      sleep 86400;
      done"
    restart: unless-stopped

volumes:
  qdrant_data:
  es_data:
  redis_data:
  pg_data:
  upload_tmp:
  caddy_data:
  caddy_config:
